name: CI

on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.lisp }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lisp: [sbcl-bin]

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies from APT
        run: sudo apt-get install -y libev-dev gcc libc6-dev
      - name: Generate server certificates
        run: sh ./t/generate-certificates.sh
      - name: Install Roswell
        env:
          LISP: ${{ matrix.lisp }}
          ROSWELL_INSTALL_DIR: /usr
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
      - name: Install Ultralisp
        run: ros -e '(ql-dist:install-dist "http://dist.ultralisp.org/" :prompt nil)'
      - name: Install Rove
        run: ros install rove
      - name: Run tests
        env:
          LISP: ${{ matrix.lisp }}
        run: |
          ulimit -n 256
          PATH="$HOME/.roswell/bin:$PATH"
          export PATH
          rove woo-test.asd
      - name: Check conformance launcher identity and report handling
        timeout-minutes: 5
        run: python3 t/conformance/test_autobahn_runner.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: t/hegel/go.mod
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Build pinned Rust parity oracle
        timeout-minutes: 10
        run: cargo build --locked --manifest-path t/hegel/oracle/Cargo.toml
      - name: Run Hegel live protocol properties
        timeout-minutes: 12
        env:
          LISP: ${{ matrix.lisp }}
          WOO_HEGEL_LISP: ros
        run: go -C t/hegel test -count=1 -skip '^TestManaged' -timeout 10m ./...
