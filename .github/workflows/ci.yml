name: CI

on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.lisp }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lisp: [sbcl-bin]

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies from APT
        run: sudo apt-get install -y libev-dev gcc libc6-dev
      - name: Generate server certificates
        run: sh ./t/generate-certificates.sh
      - name: Install Roswell
        env:
          LISP: ${{ matrix.lisp }}
          ROSWELL_INSTALL_DIR: /usr
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
      - name: Install frozen Quicklisp distribution
        run: ros -e '(ql-dist:install-dist "http://beta.quicklisp.org/dist/quicklisp/2026-01-01/distinfo.txt" :prompt nil :replace t)'
      - name: Install Rove
        run: ros install rove
      - name: Run tests
        timeout-minutes: 10
        env:
          LISP: ${{ matrix.lisp }}
        run: |
          ulimit -n 256
          PATH="$HOME/.roswell/bin:$PATH"
          export PATH
          set +e
          report="$RUNNER_TEMP/native-stall-report.txt"
          : > "$report"
          capture_owned_state() {
            root_pid="$1"
            group_id="$2"
            capture_start=$SECONDS
            {
              echo "native watchdog capture start=$(date -u +%s) root=$root_pid pgid=$group_id"
              ps -eo pid=,ppid=,pgid=,stat=,wchan= | awk -v g="$group_id" '$3 == g && $4 !~ /^Z/ {print}' | head -n 64
            } >> "$report"
            pids=$(ps -eo pid=,ppid=,pgid=,stat= | awk -v g="$group_id" '$3 == g && $4 !~ /^Z/ {print $1}' | head -n 64)
            for pid in $pids; do
              remaining=$((30 - (SECONDS - capture_start)))
              [ "$remaining" -gt 0 ] || break
              gdb_budget=$remaining
              [ "$gdb_budget" -gt 10 ] && gdb_budget=10
              {
                echo "--- owned pid=$pid ---"
                ps -o pid=,ppid=,pgid=,stat=,wchan= -p "$pid" || true
                if [ -r "/proc/$pid/wchan" ]; then cat "/proc/$pid/wchan" || true; fi
                timeout "${gdb_budget}s" gdb -batch -q -p "$pid" \
                  -ex 'set print frame-arguments none' \
                  -ex 'thread apply all bt' -ex detach -ex quit 2>&1 | head -c 65536 || true
              } >> "$report"
              if [ "$(wc -c < "$report")" -gt 4194304 ]; then
                head -c 4194304 "$report" > "$report.truncated"
                mv "$report.truncated" "$report"
              fi
            done
            head -c 262144 "$report" > "$report.truncated"
            mv "$report.truncated" "$report"
            echo "bounded owned process report: $report"
            cat "$report"
          }
          setsid ros dynamic-space-size=4096 \
            -e '(push (truename "./") asdf:*central-registry*)' \
            -s woo-test \
            -e '(unless (rove:run :woo-test) (uiop:quit 1))' &
          native_pid=$!
          native_pgid=$native_pid
          started=$SECONDS
          status=124
          timed_out=0
          while kill -0 "$native_pid" 2>/dev/null || \
                ps -eo pid=,pgid=,stat= | awk -v g="$native_pgid" '$2 == g && $3 !~ /^Z/ {found=1} END {exit !found}'; do
            elapsed=$((SECONDS - started))
            if [ "$elapsed" -ge 540 ]; then
              echo "native watchdog deadline elapsed=$elapsed; capturing before termination"
              timed_out=1
              capture_owned_state "$native_pid" "$native_pgid"
              kill -TERM -- "-$native_pgid" 2>/dev/null || true
              sleep 10
              kill -KILL -- "-$native_pgid" 2>/dev/null || true
              wait "$native_pid" 2>/dev/null || true
              break
            fi
            sleep 1
          done
          if [ "$timed_out" -eq 0 ] && ! kill -0 "$native_pid" 2>/dev/null; then
            wait "$native_pid"
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            echo "native test command exited $status"
          fi
          exit "$status"
