name: CI

on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.lisp }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lisp: [sbcl-bin]

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies from APT
        run: sudo apt-get install -y libev-dev gcc libc6-dev
      - name: Generate server certificates
        run: sh ./t/generate-certificates.sh
      - name: Install Roswell
        env:
          LISP: ${{ matrix.lisp }}
          ROSWELL_INSTALL_DIR: /usr
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
      - name: Install frozen Quicklisp distribution
        run: ros -e '(ql-dist:install-dist "http://beta.quicklisp.org/dist/quicklisp/2026-01-01/distinfo.txt" :prompt nil :replace t)'
      - name: Install Rove
        run: ros install rove
      - name: Run tests
        timeout-minutes: 10
        env:
          LISP: ${{ matrix.lisp }}
        run: |
          ulimit -n 256
          PATH="$HOME/.roswell/bin:$PATH"
          export PATH
          set +e
          timeout --signal=TERM --kill-after=10s 540s ros dynamic-space-size=4096 \
            -e '(push (truename "./") asdf:*central-registry*)' \
            -s woo-test \
            -e '(unless (rove:run :woo-test) (uiop:quit 1))'
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "native test command exited $status; collecting bounded process state"
            date -u
            ps -eo pid,ppid,stat,wchan:32,command || true
            for pid in $(pgrep -f 'ros|sbcl' || true); do
              echo "--- pid $pid ---"
              ps -o pid,ppid,stat,wchan:32,command -p "$pid" || true
              if [ -r "/proc/$pid/wchan" ]; then cat "/proc/$pid/wchan" || true; fi
              gdb -batch -q -p "$pid" -ex 'thread apply all bt' -ex detach -ex quit 2>&1 || true
            done
          fi
          exit "$status"
