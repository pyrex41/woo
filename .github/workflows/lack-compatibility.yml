name: Lack compatibility
on: [push, pull_request]

jobs:
  managed-profile:
    name: Managed Lack (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21
      - name: Install frozen Quicklisp distribution
        run: |
          nix develop --command sh -c '
            set -eu
            curl --fail --max-time 60 --location https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
            python3 -c "import hashlib; assert hashlib.sha256(open(\"/tmp/quicklisp.lisp\", \"rb\").read()).hexdigest() == \"4a7a5c2aebe0716417047854267397e24a44d0cce096127411e9ce9ccfeb2c17\""
            sbcl --non-interactive --load /tmp/quicklisp.lisp \
              --eval "(quicklisp-quickstart:install :path \"$HOME/quicklisp/\")"
            sbcl --non-interactive --load "$HOME/quicklisp/setup.lisp" \
              --eval "(ql-dist:install-dist \"http://beta.quicklisp.org/dist/quicklisp/2026-01-01/distinfo.txt\" :prompt nil :replace t)"
          '
      - name: Required contract, lifecycle, services and 30-minute transport soak
        run: |
          nix develop --command python3 t/compat/check.py \
            --dependencies "$RUNNER_TEMP/woo-compat-deps" \
            --artifacts .artifacts/lack
          nix develop --command python3 t/compat/check.py --verify-receipt .artifacts/lack/receipt.json
      - name: Preserve receipts and bounded logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lack-compatibility-${{ matrix.os }}
          path: .artifacts/lack/
          if-no-files-found: error
